name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.9.1"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish GitHub release
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check version, extract notes, package headers
        run: ci/package-release.sh "$TAG" dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --verify-tag \
              --title "msgpack-cpp ${TAG#v}" \
              --notes-file dist/notes.md \
              dist/*-headers.tar.gz dist/*-headers.zip dist/SHA256SUMS
