name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "gcc-9 (Release)",     os: ubuntu-22.04,   cc: gcc-9,    cxx: g++-9,      build_type: Release }
          - { name: "gcc-14 (Release)",    os: ubuntu-24.04,   cc: gcc-14,   cxx: g++-14,     build_type: Release }
          - { name: "gcc-14 (Debug)",      os: ubuntu-24.04,   cc: gcc-14,   cxx: g++-14,     build_type: Debug }
          - { name: "clang-13 (Release)",  os: ubuntu-22.04,   cc: clang-13, cxx: clang++-13, build_type: Release }
          - { name: "clang-18 (Release)",  os: ubuntu-24.04,   cc: clang-18, cxx: clang++-18, build_type: Release }
          - { name: "AppleClang (Release)", os: macos-latest,  cc: "",       cxx: "",         build_type: Release }
          - { name: "MSVC (Release)",      os: windows-latest, cc: "",       cxx: "",         build_type: Release }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # empty CC/CXX means "use the runner's default compiler"
          [ -n "$CC" ] || unset CC
          [ -n "$CXX" ] || unset CXX
          cmake -S . -B build -DENABLE_TESTING=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sanitizers:
    name: ASan + UBSan (clang-18)
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      SAN_FLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -DENABLE_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          "-DCMAKE_CXX_FLAGS=$SAN_FLAGS"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  install:
    name: Install + pkg-config consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure and install
        run: |
          # the prefix is baked into msgpack-cpp.pc at configure time
          cmake -S . -B build "-DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/prefix"
          cmake --install build

      - name: Check installed files
        run: |
          for f in include/packer.h include/unpacker.h include/msgpack-platform.h lib/pkgconfig/msgpack-cpp.pc; do
            test -f "$RUNNER_TEMP/prefix/$f" || { echo "missing: $f"; exit 1; }
          done

      - name: Build and run consumer
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/prefix/lib/pkgconfig
        run: |
          read -ra cflags < <(pkg-config --cflags msgpack-cpp)
          g++ -std=c++11 -Wall -Wextra -Werror "${cflags[@]}" \
              ci/install_consumer.cpp -o "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer"

  benchmark:
    name: Benchmark build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DENABLE_BENCHMARKING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
